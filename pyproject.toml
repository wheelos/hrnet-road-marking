[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrnet-road-marking"
version = "0.1.0"
description = "Eight-class HRNet-OCR road marking training, evaluation and export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1,<2.6",
  "torchvision>=0.16,<0.21",
  "numpy>=1.24,<2",
  "Pillow>=10",
]

[project.optional-dependencies]
export = ["onnx>=1.16,<2", "onnxruntime>=1.18,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9", "build"]

[project.scripts]
hrnet-prepare = "hrnet_road_marking.prepare:main"
hrnet-train = "hrnet_road_marking.train:main"
hrnet-evaluate = "hrnet_road_marking.evaluate:main"
hrnet-predict = "hrnet_road_marking.predict:main"
hrnet-export = "hrnet_road_marking.export:main"

[tool.setuptools.packages.find]
include = ["hrnet_road_marking*"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["hrnet_road_marking/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
